<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Primary Orange / Gold Gradient -->
    <linearGradient id="eqOrangeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#FF5E00" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Accent White / Light Gradient -->
    <linearGradient id="eqLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFD6A5" stop-opacity="0.4" />
    </linearGradient>

    <!-- Dark Metal Glass Gradient -->
    <linearGradient id="eqDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="eqGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Base Frame (Rounded Polygon Squircle) -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#eqDarkGrad)" stroke="url(#eqOrangeGrad)" stroke-width="3" />

  <!-- Inner Subtle Bevel Stroke -->
  <rect x="9" y="9" width="82" height="82" rx="21" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- 'E' Monogram Base Lines -->
  <rect x="22" y="24" width="14" height="52" rx="4" fill="url(#eqOrangeGrad)" />
  <rect x="36" y="64" width="32" height="12" rx="4" fill="url(#eqOrangeGrad)" />
  <rect x="36" y="44" width="24" height="11" rx="3.5" fill="url(#eqOrangeGrad)" />

  <!-- Ascending Growth Peak & Arrow -->
  <path d="M 36 24 H 56 L 78 24 L 78 46 L 66 34 L 50 50 L 36 36 V 24 Z" fill="url(#eqOrangeGrad)" filter="url(#eqGlow)" />

  <!-- Upward Trend Line Overlay -->
  <path d="M 28 58 L 46 40 L 56 50 L 76 28" stroke="url(#eqLightGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 64 28 H 76 V 40" stroke="url(#eqLightGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Node Glow Dot -->
  <circle cx="76" cy="28" r="4" fill="#FFFFFF" filter="url(#eqGlow)" />
</svg>
